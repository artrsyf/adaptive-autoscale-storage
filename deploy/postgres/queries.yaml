storage_pg_activity:
  query: "SELECT coalesce(state,'unknown') AS state, coalesce(wait_event_type,'none') AS wait_type, count(*) AS connections FROM pg_stat_activity WHERE datname=current_database() AND backend_type='client backend' GROUP BY 1,2"
  metrics:
    - state: {usage: LABEL, description: Backend state}
    - wait_type: {usage: LABEL, description: Wait class}
    - connections: {usage: GAUGE, description: Connections by state and wait class}
storage_pg_blocking:
  query: "SELECT count(*) AS sessions FROM pg_stat_activity WHERE datname=current_database() AND cardinality(pg_blocking_pids(pid)) > 0"
  metrics:
    - sessions: {usage: GAUGE, description: Sessions blocked by another backend}
storage_pg_statements:
  query: "SELECT coalesce(sum(calls),0) AS calls, coalesce(sum(total_exec_time),0)/1000 AS execution_seconds, coalesce(sum(shared_blks_read),0) AS blocks_read, coalesce(sum(shared_blks_hit),0) AS blocks_hit FROM pg_stat_statements WHERE dbid=(SELECT oid FROM pg_database WHERE datname=current_database()) AND query ~* '(FROM|INTO|UPDATE) documents'"
  metrics:
    - calls: {usage: COUNTER, description: Document SQL statement calls}
    - execution_seconds: {usage: COUNTER, description: Cumulative document SQL execution seconds}
    - blocks_read: {usage: COUNTER, description: Document SQL shared blocks read}
    - blocks_hit: {usage: COUNTER, description: Document SQL shared blocks hit}
storage_pg_wal:
  query: "SELECT wal_bytes::float8 AS bytes, wal_write_time/1000 AS write_seconds, wal_sync_time/1000 AS sync_seconds FROM pg_stat_wal"
  metrics:
    - bytes: {usage: COUNTER, description: WAL bytes generated}
    - write_seconds: {usage: COUNTER, description: WAL write seconds}
    - sync_seconds: {usage: COUNTER, description: WAL sync seconds}
