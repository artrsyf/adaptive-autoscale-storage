global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: kubernetes-cadvisor
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs:
      - role: node
    metrics_path: /metrics/cadvisor
    relabel_configs:
      - action: replace
        source_labels: [__meta_kubernetes_node_name]
        target_label: kubernetes_node
      - action: replace
        target_label: __address__
        replacement: kubernetes.default.svc:443
      - action: replace
        source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        target_label: __metrics_path__
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: router
    static_configs:
      - targets: ["router:8080"]
  - job_name: control-plane
    static_configs:
      - targets: ["control-plane:8080"]
  - job_name: processing-unit
    static_configs:
      - targets:
          - processing-unit-1.processing-unit-headless:8080
          - processing-unit-2.processing-unit-headless:8080
          - processing-unit-3.processing-unit-headless:8080
  - job_name: load
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["autoscale-storage"]
    relabel_configs:
      - action: keep
        source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: load
      - action: keep
        source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
      - action: replace
        source_labels: [__meta_kubernetes_pod_ip]
        regex: (.+)
        replacement: ${1}:9091
        target_label: __address__
