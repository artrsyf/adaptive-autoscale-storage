apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: router
      annotations:
        checksum/config: {{ .Values.configs.router | sha256sum | quote }}
    spec:
      serviceAccountName: application
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: "{{ .Values.images.router.repository }}:{{ .Values.images.router.tag }}"
          imagePullPolicy: {{ .Values.images.router.pullPolicy }}
          args: ["--config", "/etc/storage/config.yaml"]
          env:
            - name: GOMEMLIMIT
              value: 140MiB
            - name: GOMAXPROCS
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/storage
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: router-config
