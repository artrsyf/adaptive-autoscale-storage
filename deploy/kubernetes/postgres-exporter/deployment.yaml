apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
      annotations:
        checksum/config: {{ .Values.configs.postgresExporter | sha256sum | quote }}
    spec:
      serviceAccountName: application
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-exporter
          image: "{{ .Values.images.postgresExporter.repository }}:{{ .Values.images.postgresExporter.tag }}"
          imagePullPolicy: {{ .Values.images.postgresExporter.pullPolicy }}
          env:
            - name: DATA_SOURCE_URI
              value: postgres:5432/storage?sslmode=disable
            - name: DATA_SOURCE_USER
              value: monitor
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecrets.credentials }}
                  key: MONITOR_PASSWORD
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: /etc/postgres-exporter/queries.yaml
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/postgres-exporter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: postgres-exporter-config
