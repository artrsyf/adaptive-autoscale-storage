apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-actuator
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["processing-unit"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["processing-unit"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
