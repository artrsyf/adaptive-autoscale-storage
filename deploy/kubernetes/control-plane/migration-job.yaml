apiVersion: batch/v1
kind: Job
metadata:
  name: scaling-operation-migration
{{ if not .Release.IsInstall }}
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
{{ end }}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scaling-operation-migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: application
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready --host postgres --port 5432 --username storage --dbname storage; do sleep 2; done
              psql --host postgres --port 5432 --username storage --dbname storage \
                --set ON_ERROR_STOP=1 --file /migrations/004_scaling_operations.sql
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecrets.credentials }}
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: migrations
          configMap:
            name: postgres-init
        - name: tmp
          emptyDir: {}
