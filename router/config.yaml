# Жизненный цикл входящего HTTP-сервера, включая health и /metrics.
server:
  # Адрес прослушивания; 0.0.0.0 принимает подключения на всех интерфейсах контейнера.
  listen_host: 0.0.0.0
  # TCP-порт сервера; допустимы значения от 1 до 65535.
  port: 8080
  # Предельное время чтения HTTP-заголовков, например 2s.
  read_header_timeout: 2s
  # Предельное время чтения всего HTTP-запроса, включая тело.
  read_timeout: 5s
  # Предельное время записи HTTP-ответа; должно превышать request_timeout API.
  write_timeout: 6s
  # Время ожидания следующего запроса в неактивном keep-alive соединении.
  idle_timeout: 60s
  # Deadline одной проверки готовности: БД у исполнителя, всех нод у Router.
  ready_timeout: 1s
  # Время ожидания активных HTTP-запросов при завершении процесса.
  shutdown_timeout: 10s
# Ограничения документного HTTP API.
api:
  # Максимальный размер JSON-тела в байтах; превышение возвращает HTTP 413.
  max_body_bytes: 1048576
  # Deadline обработки команды, включая ожидание зависимостей; длительность с единицами.
  request_timeout: 4s
# Ограничение одновременных запросов, направляемых Router исполнителям.
routing:
  # Максимум одновременно исполняемых команд на процесс; лишние сразу получают HTTP 429.
  max_inflight: 192
# Соединения и таймауты исходящего HTTP-клиента Router.
processing_unit_client:
  # Максимум неактивных HTTP-соединений во всём исходящем пуле Router.
  max_idle_connections: 128
  # Максимум неактивных HTTP-соединений к одному исполнителю.
  max_idle_per_host: 64
  # Максимум всех HTTP-соединений к одному исполнителю; ожидание входит в deadline команды.
  max_connections_per_host: 128
  # Срок хранения неактивного соединения исходящего HTTP-пула.
  idle_timeout: 60s
  # Предел ожидания заголовков ответа исполнителя после отправки запроса.
  response_header_timeout: 4s
# Статическая карта маршрутизации; при изменении требуется согласованное обновление стенда.
assignment:
  # Версия назначения; Router и processing unit должны использовать одинаковое значение. Это не fencing.
  epoch: "1"
  # Число логических разделов (1–1024); должно совпадать у Router, исполнителей и генератора нагрузки.
  partitions: 128
  # Упорядоченный список исполнителей; порядок влияет на выбор владельца раздела.
  nodes:
    # Уникальный идентификатор исполнителя; должен совпадать с его аргументом --node.
    - id: processing-unit-1
      # HTTP origin исполнителя без пути и параметров; адрес должен быть доступен из Router.
      url: http://processing-unit-1:8080
    # Уникальный идентификатор исполнителя; должен совпадать с его аргументом --node.
    - id: processing-unit-2
      # HTTP origin исполнителя без пути и параметров; адрес должен быть доступен из Router.
      url: http://processing-unit-2:8080
    # Уникальный идентификатор исполнителя; должен совпадать с его аргументом --node.
    - id: processing-unit-3
      # HTTP origin исполнителя без пути и параметров; адрес должен быть доступен из Router.
      url: http://processing-unit-3:8080
