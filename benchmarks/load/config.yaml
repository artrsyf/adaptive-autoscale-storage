# Базовый HTTP-адрес Router, доступный из контейнера генератора.
target: "http://router:8080"
# TCP-порт endpoint /metrics генератора; должен совпадать с target Prometheus.
metrics_port: 9091
# Число логических разделов (1–1024); должно совпадать у Router, исполнителей и генератора нагрузки.
partitions: 128
# Профиль темпа: constant — постоянный, ramp — рост, burst — кратковременный всплеск.
scenario: "constant"
# uniform — равномерный выбор ключей; hot — 80% итераций на ключи раздела 0.
distribution: "uniform"
# Целевые логические итерации в секунду, не HTTP RPS: update включает get и update.
rate: 100
# Доля read-only итераций в процентах (0–100); остальные читают и условно обновляют.
read_percent: 80
# Число документов в наборе генератора, не менее 128; заполнение не входит в измерение.
records: 4096
# Приблизительный размер JSON payload в байтах (16–900000).
payload_bytes: 1024
# Предел параллельных итераций (1–4096); при насыщении новые итерации учитываются как пропущенные.
workers: 128
# Начальное значение генератора случайных чисел для воспроизводимого выбора запросов.
seed: 42
# Длительность измеряемой фазы с единицами; заполнение и прогрев выполняются отдельно.
duration: "1m0s"
# Длительность прогрева перед измерением; 0s отключает прогрев.
warmup: "10s"
# Предел времени одного HTTP-вызова генератора, включая чтение ответа.
request_timeout: "5s"
# Каталог результатов; каждый прогон создаёт вложенную директорию с UTC-временем.
output: "/results"
# Оставлять генератор работающим после прогона, чтобы Prometheus успел собрать итоговые метрики.
hold: true
