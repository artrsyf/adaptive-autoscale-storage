# Количество уникальных детерминированных ключей в каждом сценарии.
key_count: 1000000
# Моделируемый размер одной записи для оценки потенциального объёма миграции.
record_bytes: 1024
# Seed входит в генерируемые ключи и сохраняется в результатах.
seed: 42
# Повторения нужны для оценки разброса времени; размещение в них должно совпадать.
repetitions: 5
# Минимальный размер пакета построений placement; пакеты повторяются не менее 50ms для устойчивого тайминга.
timing_iterations: 1000
# Число фиксированных logical partitions в соответствующем алгоритме.
logical_partitions: 128
# Число точек consistent-hash ring на физическую ноду.
virtual_nodes: 128
# Корневой каталог локальных результатов; каждый запуск создаёт UTC-подкаталог.
output: results/partitioning
# Сценарии изменения состава нод. Идентификаторы node-1...node-N стабильны между состояниями.
transitions:
  - from_nodes: 3
    to_nodes: 4
  - from_nodes: 3
    to_nodes: 5
  - from_nodes: 5
    to_nodes: 3
  - from_nodes: 5
    to_nodes: 10
